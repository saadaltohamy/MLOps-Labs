[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "src"

[project]
name = "mlops_lab0"
version = "0.0.1"
description = "This is Lab 0 from ITI MLOps Course"
authors = [
  { name = "saadaltohamy" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "black",
    "catboost>=1.2.8",
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "flake8",
    "hydra-core>=1.3.2",
    "ipywidgets>=8.1.8",
    "isort",
    "kagglehub>=1.0.0",
    "matplotlib>=3.10.8",
    "mkdocs",
    "nbformat>=5.10.4",
    "optuna>=4.8.0",
    "optuna-integration[wandb]>=4.8.0",
    "pandas>=3.0.2",
    "pip",
    "pytest",
    "python-dotenv",
    "pyyaml>=6.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "skore>=0.15.0",
    "wandb>=0.26.0",
    "xgboost>=3.1.0",
]
requires-python = "~=3.12.0"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["mlops_lab0"]
force_sort_within_sections = true

